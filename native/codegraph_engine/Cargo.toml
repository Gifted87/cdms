[package]
name = "codegraph_engine"
version = "0.1.0"
authors = ["ProCoder System"]
edition = "2021"

[lib]
name = "codegraph_engine"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
# Rustler for NIF bridge
rustler = "0.31.0"

# Tree-sitter for AST parsing
tree-sitter = "0.24.6"
tree-sitter-elixir = "0.3.5"
tree-sitter-javascript = "0.23.1"
tree-sitter-python = "0.23.6"
tree-sitter-java = "0.23.5"
tree-sitter-typescript = "0.23.2"
tree-sitter-c-sharp = "0.23.1"
tree-sitter-cpp = "0.23.4"
tree-sitter-php = "0.23.11"
tree-sitter-go = "0.23.4"
tree-sitter-rust = "0.23.2"

[profile.release]
# Optimize for speed to ensure low-latency AST parsing
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
